name: FlagPilot · Start verified experiment (second approval)
on:
  workflow_dispatch:
    inputs:
      provision_run_id:
        description: Successful FlagPilot provisioning workflow run ID
        required: true
        type: string
      experiment_id:
        description: Experiment ID recorded in that provisioning run
        required: true
        type: string
      demo_verified:
        description: Confirm SDK exposure and conversion event delivery were tested
        required: true
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
concurrency:
  group: flagpilot-start-${{ github.ref }}
  cancel-in-progress: false
jobs:
  branch-guard:
    name: Reject non-main workflow dispatches
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::This workflow may only run from refs/heads/main."
          exit 1
      - name: Confirm protected main branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "Workflow ref is refs/heads/main."
  verify:
    name: Verify provisioning evidence before start approval
    needs: [branch-guard]
    if: ${{ github.ref == 'refs/heads/main' && inputs.demo_verified == true && needs.branch-guard.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify successful provisioning run and select its artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PROVISION_RUN_ID: ${{ inputs.provision_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$PROVISION_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Provisioning run ID must be a positive integer."
            exit 1
          fi
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROVISION_RUN_ID")"
          test "$(jq -r '.status' <<<"$RUN")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN")" = "success"
          test "$(jq -r '.event' <<<"$RUN")" = "workflow_dispatch"
          test "$(jq -r '.head_branch' <<<"$RUN")" = "main"
          test "$(jq -r '.repository.full_name' <<<"$RUN")" = "$GITHUB_REPOSITORY"
          WORKFLOW_PATH="$(jq -r '.path' <<<"$RUN")"
          case "$WORKFLOW_PATH" in
            ".github/workflows/promote-pr-review.yml")
              echo "artifact_name=flagpilot-pr-provision-result" >> "$GITHUB_OUTPUT"
              ;;
            ".github/workflows/plan-and-create.yml")
              echo "artifact_name=flagpilot-provision-result" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::The selected run is not an approved FlagPilot provisioning workflow."
              exit 1
              ;;
          esac
          echo "Verified successful provisioning workflow $WORKFLOW_PATH, run #$PROVISION_RUN_ID."
      - name: Download the exact provisioning result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: artifacts/provision-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.provision_run_id }}
          github-token: ${{ github.token }}
      - name: Verify experiment ID and target project/environment
        env:
          PROVISION_RESULT_PATH: artifacts/provision-source/provision-result.json
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          FLAGSMITH_PROJECT_ID: ${{ vars.FLAGSMITH_PROJECT_ID }}
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
        run: npm run verify:start-target
      - name: Carry the verified immutable provisioning evidence to the approval job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-start-approval-target
          path: artifacts/provision-source/provision-result.json
          if-no-files-found: error
          retention-days: 1
  start:
    name: Start the verified experiment after second human approval
    needs: [branch-guard, verify]
    if: ${{ github.ref == 'refs/heads/main' && inputs.demo_verified == true && needs.branch-guard.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: flagsmith-start
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Download verified provisioning evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-start-approval-target
          path: artifacts/provision-source
      - name: Revalidate live Flagsmith configuration and start
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_API_URL: https://api.flagsmith.com
          FLAGSMITH_PROJECT_ID: ${{ vars.FLAGSMITH_PROJECT_ID }}
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          PROVISION_RUN_ID: ${{ inputs.provision_run_id }}
          PROVISION_RESULT_PATH: artifacts/provision-source/provision-result.json
        run: npm run start
