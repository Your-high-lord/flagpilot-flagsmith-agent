name: FlagPilot · Plan and provision experiment
on:
  workflow_dispatch:
    inputs:
      experiment_request:
        description: Describe the experiment, variants and what counts as success
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: flagpilot-provision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: AI plan (no Flagsmith writes)
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Generate structured experiment proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          EXPERIMENT_REQUEST: ${{ inputs.experiment_request }}
        run: npm run plan
      - name: Upload AI proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-plan
          path: artifacts/plan.json
          if-no-files-found: error
          retention-days: 3
  publish-plan:
    name: Publish validated experiment proposal in FlagPilot
    needs: [plan]
    if: ${{ github.ref == 'refs/heads/main' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-plan
          path: artifacts/plan
      - name: Publish proposal JSON to FlagPilot
        run: |
          set -euo pipefail
          mkdir -p demo/data
          cp artifacts/plan/plan.json demo/data/latest-proposal.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
      - name: Publish FlagPilot console state
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  create:
    name: Create feature, metric and draft experiment
    needs: [plan, publish-plan]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: flagsmith-create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Run read-only Flagsmith preflight
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_API_URL: https://api.flagsmith.com
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
        run: npm run preflight
      - name: Install Flagsmith CLI v2
        uses: Flagsmith/setup-cli@c7154aaa37dff8aca0b66afc1e6722e7ad00c115 # v1.0.0
        with:
          cli-version: v2.0.0
      - name: Download AI proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-plan
          path: artifacts
      - name: Provision real Flagsmith resources
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_API_URL: https://api.flagsmith.com
          FLAGSMITH_ORGANISATION: ${{ vars.FLAGSMITH_ORGANISATION }}
          FLAGSMITH_PROJECT: ${{ vars.FLAGSMITH_PROJECT }}
          FLAGSMITH_PROJECT_ID: ${{ vars.FLAGSMITH_PROJECT_ID }}
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
          FLAGSMITH_ENVIRONMENT: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
        run: npm run provision
      - name: Upload provisioning report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-provision-result
          path: artifacts/provision-result.json
          if-no-files-found: error
          retention-days: 7

  publish-result:
    name: Publish verified provisioning result to FlagPilot
    needs: [create]
    if: ${{ github.ref == 'refs/heads/main' && needs.create.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-provision-result
          path: artifacts/provision
      - name: Publish sanitized provisioning evidence
        env:
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p demo/data
          jq --arg runId "$RUN_ID" --arg workflow "$WORKFLOW_NAME" --arg headSha "$HEAD_SHA" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              run: {id: ($runId|tonumber), workflow: $workflow, headSha: $headSha, publishedAt: $publishedAt},
              artifact: {
                target: {projectId: .target.projectId},
                proposal: .proposal,
                result: .result,
                createdAt: .createdAt
              }
            }
          ' artifacts/provision/provision-result.json > demo/data/latest-provisioning.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
      - name: Publish FlagPilot console state
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
