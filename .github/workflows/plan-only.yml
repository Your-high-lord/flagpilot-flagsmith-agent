name: FlagPilot · AI proposal only
on:
  workflow_dispatch:
    inputs:
      experiment_request:
        description: Describe the experiment, variants and success metric
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: flagpilot-plan-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Generate and validate proposal (no Flagsmith writes)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate structured experiment proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          EXPERIMENT_REQUEST: ${{ inputs.experiment_request }}
        run: npm run plan
      - name: Upload validated proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-plan-only
          path: artifacts/plan.json
          if-no-files-found: error
          retention-days: 3
