name: FlagPilot · Promote approved PR review to experiment
on:
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Successful FlagPilot PR review run ID
        required: true
        type: string
      rollout_percentage:
        description: Percentage of eligible Development traffic
        required: true
        default: "10"
        type: string
      timeframe_days:
        description: Experiment measurement window in days
        required: true
        default: "7"
        type: string
      confirm_event_delivery:
        description: Human confirms the exact event was delivered to Flagsmith and the connected warehouse
        required: true
        default: false
        type: boolean
      confirm_provision:
        description: Confirm that you reviewed the PR report and want to create a draft experiment
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: flagpilot-pr-promotion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Verify review and prepare experiment proposal
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_provision == true && inputs.confirm_event_delivery == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify source review run
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Review run ID must be a positive integer."
            exit 1
          fi
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN_ID")"
          test "$(jq -r '.path' <<<"$RUN")" = ".github/workflows/review-pull-request.yml"
          test "$(jq -r '.status' <<<"$RUN")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN")" = "success"
          test "$(jq -r '.head_branch' <<<"$RUN")" = "main"
          echo "Verified successful FlagPilot PR review run #$REVIEW_RUN_ID."
      - name: Download source review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-pr-review
          path: artifacts/source-review
          repository: ${{ github.repository }}
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}
      - name: Convert eligible review to validated proposal
        env:
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
          TIMEFRAME_DAYS: ${{ inputs.timeframe_days }}
          CONFIRM_PROVISION: ${{ inputs.confirm_provision }}
          CONFIRM_EVENT_DELIVERY: ${{ inputs.confirm_event_delivery }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:pr-proposal
      - name: Upload validated proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-pr-derived-plan
          path: artifacts/plan.json
          if-no-files-found: error
          retention-days: 3
  provision:
    name: Create Flagsmith draft after human approval
    needs: [prepare]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: flagsmith-create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Read-only Flagsmith preflight
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_API_URL: https://api.flagsmith.com
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
        run: npm run preflight
      - name: Install Flagsmith CLI v2
        uses: Flagsmith/setup-cli@c7154aaa37dff8aca0b66afc1e6722e7ad00c115 # v1.0.0
        with:
          cli-version: v2.0.0
      - name: Download validated proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-pr-derived-plan
          path: artifacts
      - name: Recheck source PR after approval and immediately before provisioning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:pr-source
      - name: Provision real Flagsmith resources
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
          FLAGSMITH_API_URL: https://api.flagsmith.com
          FLAGSMITH_ORGANISATION: ${{ vars.FLAGSMITH_ORGANISATION }}
          FLAGSMITH_PROJECT: ${{ vars.FLAGSMITH_PROJECT }}
          FLAGSMITH_PROJECT_ID: ${{ vars.FLAGSMITH_PROJECT_ID }}
          FLAGSMITH_ENVIRONMENT_KEY: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
          FLAGSMITH_ENVIRONMENT: ${{ vars.FLAGSMITH_ENVIRONMENT_KEY }}
        run: npm run provision
      - name: Upload provisioning evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-pr-provision-result
          path: artifacts/provision-result.json
          if-no-files-found: error
          retention-days: 7

  publish-result:
    name: Publish verified provisioning result to FlagPilot
    needs: [provision]
    if: ${{ github.ref == 'refs/heads/main' && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flagpilot-pr-provision-result
          path: artifacts/provision
      - name: Publish sanitized provisioning evidence
        env:
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p demo/data
          jq --arg runId "$RUN_ID" --arg workflow "$WORKFLOW_NAME" --arg headSha "$HEAD_SHA" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              run: {id: ($runId|tonumber), workflow: $workflow, headSha: $headSha, publishedAt: $publishedAt},
              artifact: {
                target: {projectId: .target.projectId},
                proposal: .proposal,
                result: .result,
                createdAt: .createdAt
              }
            }
          ' artifacts/provision/provision-result.json > demo/data/latest-provisioning.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
      - name: Publish FlagPilot console state
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
