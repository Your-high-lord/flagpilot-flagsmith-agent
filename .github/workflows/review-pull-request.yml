name: FlagPilot · Review PR for experiment opportunities
on:
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: Public GitHub pull request URL to analyse
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: flagpilot-pr-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: AI code review and experiment design
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Analyse PR diff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          PULL_REQUEST_URL: ${{ inputs.pull_request_url }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_GITHUB_TOKEN: ${{ secrets.PUBLIC_GITHUB_TOKEN }}
        run: npm run review:pr
      - name: Upload PR review report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagpilot-pr-review
          path: artifacts/pr-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload updated FlagPilot dashboard and latest report
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: "flagpilot-pr-review-pages-${{ github.run_id }}-${{ github.run_attempt }}"
          path: demo
      - name: Wait for this run's Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: "flagpilot-pr-review-pages-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            echo "Checking Pages artifact visibility (attempt ${attempt}/15)…"
            if artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" 2>/dev/null)"; then
              artifact_id="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[]? | select(.name == $name) | .id' <<< "$artifacts" | head -n 1)"
              if [[ -n "$artifact_id" ]]; then
                echo "Pages artifact is visible (ID $artifact_id)."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Pages artifact '$EXPECTED_ARTIFACT' did not become visible for this run attempt."
          exit 1

      - name: Publish FlagPilot dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: "flagpilot-pr-review-pages-${{ github.run_id }}-${{ github.run_attempt }}"
