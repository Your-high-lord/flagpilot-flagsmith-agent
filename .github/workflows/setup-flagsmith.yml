name: Set up FlagPilot environment
on:
  workflow_dispatch:
    inputs:
      organisation:
        description: Flagsmith organisation name
        required: true
        default: "Asir's Org"
        type: string
      project:
        description: Existing Flagsmith project name
        required: true
        default: "My first project"
        type: string
      environment_name:
        description: Dedicated environment to create or reuse
        required: true
        default: "FlagPilot Development"
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: flagpilot-environment-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    name: Create or reuse dedicated environment
    runs-on: ubuntu-latest
    environment:
      name: flagsmith-create
    env:
      FLAGSMITH_ORGANISATION: ${{ inputs.organisation }}
      FLAGSMITH_PROJECT: ${{ inputs.project }}
      FLAGSMITH_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install Flagsmith CLI v2
        uses: Flagsmith/setup-cli@c7154aaa37dff8aca0b66afc1e6722e7ad00c115 # v1.0.0
        with:
          cli-version: v2.0.0
      - name: Verify CLI authentication
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
        run: flagsmith auth status --json
      - name: Create or reuse FlagPilot Development
        id: environment
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
        run: npm run setup:environment
      - name: Save non-secret repository variables
        env:
          ORG: ${{ inputs.organisation }}
          PROJECT: ${{ inputs.project }}
          PROJECT_ID: ${{ steps.environment.outputs.project_id }}
          ENVIRONMENT_KEY: ${{ steps.environment.outputs.environment_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh variable set FLAGSMITH_ORGANISATION --body "$ORG" --repo "$GITHUB_REPOSITORY"
          gh variable set FLAGSMITH_PROJECT --body "$PROJECT" --repo "$GITHUB_REPOSITORY"
          gh variable set FLAGSMITH_PROJECT_ID --body "$PROJECT_ID" --repo "$GITHUB_REPOSITORY"
          gh variable set FLAGSMITH_ENVIRONMENT_KEY --body "$ENVIRONMENT_KEY" --repo "$GITHUB_REPOSITORY"
          gh variable set GEMINI_MODEL --body "gemini-3.8-flash" --repo "$GITHUB_REPOSITORY"
