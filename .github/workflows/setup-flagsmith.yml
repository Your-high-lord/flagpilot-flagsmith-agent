name: Set up FlagPilot environment
on:
  workflow_dispatch:
    inputs:
      organisation:
        description: Flagsmith organisation name
        required: true
        default: "Asir's Org"
        type: string
      project:
        description: Existing Flagsmith project name
        required: true
        default: "My first project"
        type: string
      environment_name:
        description: Dedicated environment to create or reuse
        required: true
        default: "FlagPilot Development"
        type: string
permissions:
  contents: read
concurrency:
  group: flagpilot-environment-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    name: Create or reuse dedicated environment
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: flagsmith-create
    env:
      FLAGSMITH_ORGANISATION: ${{ inputs.organisation }}
      FLAGSMITH_PROJECT: ${{ inputs.project }}
      FLAGSMITH_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install Flagsmith CLI v2
        uses: Flagsmith/setup-cli@c7154aaa37dff8aca0b66afc1e6722e7ad00c115 # v1.0.0
        with:
          cli-version: v2.0.0
      - name: Verify CLI authentication
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
        run: flagsmith auth status --json
      - name: Create or reuse FlagPilot Development
        id: environment
        env:
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
        run: npm run setup:environment
      - name: Show required repository variables
        run: |
          {
            echo '## Next manual setup step'
            echo 'Flagsmith environment creation succeeded. GitHub blocks the workflow GITHUB_TOKEN from writing Actions variables, so set these under Settings → Secrets and variables → Actions → Variables:'
            echo "- FLAGSMITH_ORGANISATION = Asir's Org"
            echo '- FLAGSMITH_PROJECT = My first project'
            echo '- FLAGSMITH_PROJECT_ID = value shown above'
            echo '- FLAGSMITH_ENVIRONMENT_KEY = client-side environment key from this run output (public SDK key)'
            echo 'Do not store the organisation API key as a variable; it remains an environment secret.'
          } >> "$GITHUB_STEP_SUMMARY"
